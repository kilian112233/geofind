[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geofind"
version = "0.1.0"
description = "Offline multi-module media geolocation with Bayesian reranking"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9",
    "rich>=13.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.11",
    "Pillow>=10.0",
    "exifread>=3.0",
    "langdetect>=1.0.9",
    "requests>=2.28",
]

[project.optional-dependencies]
geoclip = ["geoclip"]
ocr = ["easyocr"]
places365 = ["torch", "torchvision"]
solar = ["astral"]
all = [
    "geoclip",
    "easyocr",
    "torch",
    "torchvision",
    "astral",
    "ultralytics",
]

[project.scripts]
geofind = "geofind.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["geofind*"]
